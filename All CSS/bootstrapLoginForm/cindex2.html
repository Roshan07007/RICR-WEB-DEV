<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-primary d-flex justify-content-center align-items-center vh-100">

  <!-- White Login Card -->
  <div class="bg-white rounded-4 shadow p-5" style="width: 380px;">
    
    <!-- Login Title -->
    <h3 class="fw-bold">
      Login 
      <span class="border-bottom border-3 border-primary pb-1"></span>
    </h3>

    <!-- Email Input -->
    <div class="mt-4">
      <label class="form-label text-secondary">Enter your email</label>
      <div class="input-group border-bottom pb-2">
        <span class="input-group-text bg-white border-0">
          <i class="bi bi-envelope"></i>
        </span>
        <input type="email" class="form-control border-0 shadow-none" placeholder="Enter your email">
      </div>
    </div>

    <!-- Password -->
    <div class="mt-4">
      <label class="form-label text-secondary">Confirm a password</label>
      <div class="input-group border-bottom pb-2">
        <span class="input-group-text bg-white border-0">
          <i class="bi bi-lock"></i>
        </span>
        <input type="password" class="form-control border-0 shadow-none" placeholder="Enter password">
        <span class="input-group-text bg-white border-0">
          <i class="bi bi-eye"></i>
        </span>
      </div>
    </div>

    <!-- Checkbox & Forgot -->
    <div class="d-flex justify-content-between align-items-center mt-4">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="remember">
        <label class="form-check-label text-secondary" for="remember">
          Remember me
        </label>
      </div>

      <a href="#" class="text-primary text-decoration-none fw-semibold">Forgot password?</a>
    </div>

    <!-- Login Button -->
    <button class="btn btn-primary w-100 mt-4 py-2 rounded-3 fw-semibold">
      Login Now
    </button>

  </div>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

</body>
</html>
