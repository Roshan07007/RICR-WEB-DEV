<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container-fluid bg-primary d-flex justify-content-center">
      <h1 class="text-white">Dice Game</h1>
    </div>

    <div>
      <div
        class="w-25 h-25 border-1 shadow border-black border mt-5 ms-5 position-absolute"
        style="left: 220px; width: auto"
      >
        <h2 class="fw-light d-flex justify-content-center">player 1</h2>
        <div class="d-flex justify-content-center">
          <img class="w-25" src="./sourse/6.jpeg" />
        </div>
        <button
          disabled
          id="btn1"
          class="rounded-2 bg-primary btn p-1 mt-2 p-1 text-white"
          style="margin-left: 135px; margin-bottom: 15px; width: 120px"
          onclick="player1()"
        >
          Roll dice
        </button>
      </div>
    </div>
    <div class="98px">
      <!-- div 2 -->
      <div
        class="w-25 h-25 border-1 border-black shadow border mt-5 ms-5 position-absolute"
        style="left: 800px; top: 60px"
      >
        <h2 class="fw-light d-flex justify-content-center">player 2</h2>
        <div class="d-flex justify-content-center">
          <img class="w-25" src="./sourse/6.jpeg" alt="" />
        </div>
        <button
          disabled
          id="btn2"
          class="rounded-2 bg-primary btn p-1 border-0 text-white mt-2"
          style="margin-left: 135px; margin-bottom: 15px; width: 120px"
          onclick="player2()"
        >
          Roll dice
        </button>
      </div>
    </div>

    <div class="position-absolute top-50" style="left: 680px">
      <h3 class="fw-bold"><h2>score broard</h2></h3>
    </div>

    <div class="position-absolute" style="top: 450px; left: 590px">
      <h3 class="fw-light">player 1</h3>
      <label id="ply1" class="d-flex justify-content-center">0</label>
    </div>

    <div class="position-absolute" style="top: 450px; left: 880px">
      <h3 class="fw-light">player 2</h3>
      <label id="ply2" class="d-flex justify-content-center">0</label>
    </div>

    <div>
      <button
        id="Start"
        class="bg-success rounded-2 p-2 border-0 position-absolute text-white"
        style="top: 550px; left: 650px"
        onclick="start()"
      >
        Start Game
      </button>
    </div>
    <div>
      <button
        id="Restart"
        class="bg-danger btn rounded-2 p-2 border-0 position-absolute text-white"
        style="top: 550px; left: 800px"
        onclick="restart()"
      >
        Restart Game
      </button>
    </div>

    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
