<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="outer-frame">
      <div class="calculator" role="application">
        <div class="top-gap"></div>

        <div class="inner">
          <div class="inner-frame">
            <div class="display" id="display"></div>

            <div class="pad">
              <button class="hover1 btn smalltxt">7</button>
              <button class="hover1 btn smalltxt">8</button>
              <button class="hover1 btn smalltxt">9</button>
              <button class="hover1 btn smalltxt op">/</button>

              <button class="hover1 btn smalltxt">4</button>
              <button class="hover1 btn smalltxt">5</button>
              <button class="hover1 btn smalltxt">6</button>
              <button class="hover1 btn smalltxt op">*</button>

              <button class="hover1 btn smalltxt">1</button>
              <button class="hover1 btn smalltxt">2</button>
              <button class="hover1 btn smalltxt">3</button>
              <button class="hover1 btn smalltxt op">-</button>

              <button class="hover1 btn smalltxt">.</button>
              <button class="hover1 btn smalltxt">0</button>
              <button class="hover1 btn smalltxt">+</button>
              <button class="hover1 btn clear">C</button>
            </div>
          </div>

          <div class="equal-wrap">
            <button class="hover1 btn equal">=</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
