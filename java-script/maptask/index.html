<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>India Static Map Search</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    #topbar {
      padding: 10px;
      background: #0e4d92;
      color: white;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #searchInput {
      padding: 8px;
      width: 250px;
      border: none;
      border-radius: 5px;
    }

    #searchBtn {
      padding: 8px 15px;
      background: white;
      color: #0e4d92;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>

  <div id="topbar">
    <strong>Search MP City:</strong>
    <input type="text" id="searchInput" placeholder="Enter MP city name (e.g., Bhopal, Indore)" />
    <button id="searchBtn">Search</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const imageBounds = [
      [6.0, 68.0],
      [37.0, 97.0]
    ];

    const map = L.map("map", {
      crs: L.CRS.EPSG4326,
      minZoom: 4,
      maxZoom: 10
    }).setView([22.0, 78.0], 5);

    L.imageOverlay("Map.jpg", imageBounds).addTo(map);

    let marker = null;

    async function searchCity(city) {
      const url =
        "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&q=" +
        encodeURIComponent(city);

      const response = await fetch(url);
      const data = await response.json();

      if (data.length === 0) {
        alert("City not found!");
        return;
      }

      const lat = parseFloat(data[0].lat);
      const lon = parseFloat(data[0].lon);

      if (marker) map.removeLayer(marker);

      marker = L.marker([lat, lon]).addTo(map);
      marker.bindPopup(`<b>${city}</b><br>Lat: ${lat}<br>Lon: ${lon}`).openPopup();

      map.setView([lat, lon], 7);
    }

    document.getElementById("searchBtn").addEventListener("click", () => {
      const city = document.getElementById("searchInput").value;
      searchCity(city);
    });

    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const city = document.getElementById("searchInput").value;
        searchCity(city);
      }
    });
  </script>

</body>

</html>
