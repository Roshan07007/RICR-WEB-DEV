<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather-App</title>
  </head>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="style.css" />
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script> -->

  <body>
    <header
      class="container-fluid bg-primary text-center text-white p-2 fw-bold"
    >
      <h1>🌧weather⌨☀🌡☔🌊</h1>
    </header>

    <main>
      <div class="container w-50 shadow p-4 mx-auto mt-5 rounded-4">
        <div class="d-flex gap-4">
          <input
            class="form-control"
            type="text"
            placeholder="Search city Name"
            name="city"
            id="city"
          />
          <button
            class="btn btn-primary form-control w-25"
            id="btn"
            onclick="getWeather()"
          >
            search
          </button>
        </div>
        <div>
          <div class="p-4 d-flex justify-content-between" id="btn"></div>
        </div>
      </div>
      <!-- <div id="lottieIcon" style="width: 60px; height: 60px"></div> -->
    </main>
    <script src="script.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
